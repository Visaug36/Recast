# Builds the static export and publishes it to GitHub Pages.
#
# Before the first run, set Settings → Pages → Source to "GitHub Actions".
# This cannot be automated: configure-pages can create the Pages site itself,
# but only with a token that has admin rights, and the GITHUB_TOKEN handed to a
# workflow does not ("Resource not accessible by integration").
#
# GitHub Pages on a private repository also requires a paid plan; on the free
# plan the repository has to be public for the site to be served.
#
# Every action here runs on node24. Node 20 was removed from the runners on
# 16 September 2026, so a node20 action is a hard failure, not a warning.
name: Deploy to GitHub Pages

on:
  push:
    # `main` is the default branch, so it is the only one Pages will publish
    # from. Feature branches were listed here while one of them *was* the
    # default; both have since been merged and deleted, and a trigger naming a
    # branch that no longer exists is a line nobody can tell is dead. Add a
    # branch back to get it built and tested in flight — the deploy job below
    # skips it either way.
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      default_branch: ${{ steps.repo.outputs.default_branch }}
      base_path: ${{ steps.repo.outputs.base_path }}
    steps:
      - uses: actions/checkout@v7

      # The **live** default branch, asked for now, rather than
      # github.event.repository.default_branch — which is a snapshot taken when
      # the push event was created and can be behind reality.
      #
      # That is not hypothetical. Run #20 pushed the rename to `main` minutes
      # before `main` became the default; the payload still named the old
      # branch, the deploy job's condition read false, the job was skipped, and
      # a skipped job does not fail a run. The workflow went green, no
      # deployment record was created, and the site stayed three days old.
      - name: Resolve the publishing branch and base path
        id: repo
        run: |
          default=$(curl -sS \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY" | jq -r .default_branch)

          if [ -z "$default" ] || [ "$default" = "null" ]; then
            echo "::error::Could not read the repository's default branch."
            exit 1
          fi

          echo "default_branch=$default" >> "$GITHUB_OUTPUT"
          echo "base_path=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          echo "publishing branch: $default (this run is on ${GITHUB_REF_NAME})"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The same path, committed. Local checks read `homepage` from
      # package.json rather than the git remote, because a remote is
      # per-checkout state that a rename does not update — this container reset
      # it to the pre-rename URL three sessions running, and GitHub's redirect
      # kept it working, so a local build and a local check agreed with each
      # other at the wrong prefix. Committing the value fixes that only if the
      # committed value cannot itself go stale, which is what this asserts.
      - name: Assert the committed site path matches this repository
        run: |
          committed=$(node scripts/site-path.mjs)
          expected="/${GITHUB_REPOSITORY#*/}"
          if [ "$committed" != "$expected" ]; then
            echo "::error::package.json homepage says $committed, but this repository publishes at $expected. Update homepage."
            exit 1
          fi
          echo "homepage path: $committed"

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A broken build should not reach the site.
      - run: pnpm lint
      - run: pnpm typecheck

      # Documentation that points at a file which is not there. `CLAUDE.md`
      # referenced a spike write-up on another branch for four stages, and
      # nobody followed the pointer, so nobody noticed. Costs ~100 ms.
      - run: pnpm check:links

      - run: pnpm test

      # A project site is served from /<repo>, so basePath has to track the
      # repository's name. Read from GITHUB_REPOSITORY, which every trigger
      # sets, rather than from the event payload, which not all of them carry —
      # and echoed, so a rename shows up in the log as a changed path rather
      # than as a site where every asset 404s.
      - name: Build static export
        run: |
          export NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}"

          # Absolute URLs for the Open Graph tags. github.io lowercases the
          # owner; the repository keeps its case. Derived from the same value
          # as basePath, so a rename carries both, and `published` below reads
          # og:url back off the live page to prove it did.
          owner="${GITHUB_REPOSITORY%%/*}"
          export NEXT_PUBLIC_SITE_URL="https://${owner,,}.github.io${NEXT_PUBLIC_BASE_PATH}/"

          echo "basePath: $NEXT_PUBLIC_BASE_PATH"
          echo "siteUrl:  $NEXT_PUBLIC_SITE_URL"
          pnpm build

      # The rename trap, asserted rather than assumed. Renaming the repository
      # moves the published site to /<new-name>; a build that kept the old
      # basePath deploys green and serves a page whose every script 404s. Read
      # the built HTML back and confirm the prefix it actually carries.
      - name: Assert the export carries the right basePath
        run: |
          expected="/${GITHUB_REPOSITORY#*/}"
          if ! grep -q "\"$expected/_next/" out/index.html; then
            echo "::error::out/index.html does not reference $expected/_next/. Every asset would 404 on the published site."
            grep -o '"/[^"]*/_next/[^"]*"' out/index.html | head -3
            exit 1
          fi
          echo "index.html references $expected/_next/"

      # Which commit this export is. Read back off the *published* site later,
      # so "the deploy succeeded" and "the new build is live" stop being the
      # same claim taken on trust.
      - name: Stamp the export with this commit
        run: |
          printf '%s' "$GITHUB_SHA" > out/build-sha.txt
          echo "out/build-sha.txt = $GITHUB_SHA"

      # The engines are only reachable through the registry's load(), so none of
      # them may appear in the entry chunk. Fails the build if that regresses.
      - name: Check bundle budget
        run: pnpm check:bundle

      # upload-pages-artifact excludes dotfiles unless told otherwise, and Pages
      # ignores _next/ without .nojekyll — a combination that publishes a broken
      # site while reporting success. Assert the file survived the build.
      - name: Assert .nojekyll is in the export
        run: |
          if [ ! -f out/.nojekyll ]; then
            echo "::error::out/.nojekyll is missing. GitHub Pages would ignore _next/ and serve a broken site."
            exit 1
          fi
          echo "out/.nojekyll present"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # Without this, the action's tar step adds --exclude=.[^/]* and drops
          # .nojekyll, so the assertion above would pass and the site would
          # still break. Both halves are needed.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages only accepts a deployment from the default branch: the github-pages
    # environment rejects any other ref, instantly and without a log, which
    # reads as a mysterious red X. Every branch in the trigger list still gets
    # built and tested — only the publish step is skipped where it could not
    # have worked.
    #
    # Gated on the branch `build` just looked up, not on the event payload. A
    # skip here is no longer silent either way: `published` below fails the run
    # if this job skips on the branch that is supposed to publish.
    if: github.ref_name == needs.build.outputs.default_branch
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The guard this workflow was missing.
  #
  # Runs even when deploy skipped — which is the whole point, because that is
  # the case nothing else notices. `!cancelled()` rather than `always()`, so
  # stopping a run by hand does not also report a deploy failure.
  #
  # It asks the published site what it is serving rather than asking the
  # workflow how it feels about itself.
  published:
    needs: [build, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Assert this build is the one being served
        run: node scripts/check-deploy.mjs
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ needs.build.outputs.default_branch }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_BASE_PATH: ${{ needs.build.outputs.base_path }}
